<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8faff" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#4f46e5" />
    <path d="M12 18L16 22L24 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="48" y="20" class="title">1. Arquitetura da Fase de Especificação (StudyFlow + Invert)</text>
    <text x="48" y="36" class="subtitle">Evolução de Produto: Da Gestão de Metas ao Laboratório Feynman de "Aprenda Ensinando" com IA</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(322, 240)">
    <path d="M0 0 L26 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="24,-5 34,0 24,5" fill="#4f46e5"/>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(638, 240)">
    <path d="M0 0 L26 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="24,-5 34,0 24,5" fill="#4f46e5"/>
  </g>

  <!-- CARD 1: Concepção Neurocientífica -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="280" height="345" rx="14" fill="url(#cardGrad1)" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="16" y="16" width="135" height="24" rx="6" fill="#e0e7ff"/>
    <text x="24" y="32" class="badge-text" fill="#4338ca">PILAR 1 • NEUROCIÊNCIA</text>
    <text x="16" y="65" class="card-title">Técnica Feynman &amp; Invert</text>

    <!-- Subcard Conceito -->
    <rect x="16" y="80" width="248" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="98" class="item-title" fill="#64748b">Inversão de Papéis:</text>
    <text x="26" y="116" class="code-font" fill="#4f46e5">&quot;O usuário vira o professor;</text>
    <text x="26" y="132" class="code-font" fill="#4f46e5">a IA vira o aluno curioso&quot;</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#6366f1"/>
      <text x="18" y="10" class="item-title">Ilusão de Competência</text>
      <text x="18" y="26" class="item-desc">Combate o estudo passivo;</text>
      <text x="18" y="40" class="item-desc">obriga recuperação ativa da memória.</text>

      <circle cx="6" cy="66" r="4" fill="#6366f1"/>
      <text x="18" y="70" class="item-title">Explicação em Linguagem Simples</text>
      <text x="18" y="86" class="item-desc">Se você não consegue simplificar,</text>
      <text x="18" y="100" class="item-desc">você ainda não domina o assunto.</text>

      <circle cx="6" cy="124" r="4" fill="#6366f1"/>
      <text x="18" y="128" class="item-title">Estudo Ubíquo (Hands-Free)</text>
      <text x="18" y="144" class="item-desc">Modo Caminhada: ensine por áudio</text>
      <text x="18" y="158" class="item-desc">enquanto caminha ou faz tarefas.</text>
    </g>
  </g>

  <!-- CARD 2: Elicitação das Personas IA -->
  <g transform="translate(356, 95)" filter="url(#shadow)">
    <rect width="280" height="345" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="2"/>
    <rect x="16" y="16" width="145" height="24" rx="6" fill="#fef3c7"/>
    <text x="24" y="32" class="badge-text" fill="#b45309">PILAR 2 • PERSONAS IA</text>
    <text x="16" y="65" class="card-title">3 Alunos Virtuais com IA</text>

    <!-- Subcard Personas -->
    <rect x="16" y="80" width="248" height="66" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="26" y="98" class="item-title" fill="#92400e">Perfis de Desafio Mental:</text>
    <text x="26" y="116" class="code-font" fill="#b45309">1. Sobrinho (Arthur, 10 anos)</text>
    <text x="26" y="132" class="code-font" fill="#b45309">2. Cética (Beatriz) | 3. Carlos (ENEM)</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
      <text x="18" y="10" class="item-title">O Sobrinho de 10 Anos</text>
      <text x="18" y="26" class="item-desc">Proíbe termos difíceis e exige</text>
      <text x="18" y="40" class="item-desc">analogias do mundo real (brinquedos).</text>

      <circle cx="6" cy="66" r="4" fill="#f59e0b"/>
      <text x="18" y="70" class="item-title">A Colega Cética</text>
      <text x="18" y="86" class="item-desc">Duvida das premissas e pergunta:</text>
      <text x="18" y="100" class="item-desc">"Mas por que exatamente isso ocorre?".</text>

      <circle cx="6" cy="124" r="4" fill="#f59e0b"/>
      <text x="18" y="128" class="item-title">O Aluno Pré-Vestibular</text>
      <text x="18" y="144" class="item-desc">Focado em pegadinhas de bancas,</text>
      <text x="18" y="158" class="item-desc">fórmulas e detalhes de prova.</text>
    </g>
  </g>

  <!-- CARD 3: Artefatos & Raio-X -->
  <g transform="translate(672, 95)" filter="url(#shadow)">
    <rect width="250" height="345" rx="14" fill="url(#cardGrad1)" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="16" y="16" width="125" height="24" rx="6" fill="#dcfce7"/>
    <text x="24" y="32" class="badge-text" fill="#15803d">PILAR 3 • FEEDBACK</text>
    <text x="16" y="65" class="card-title">Raio-X &amp; Evolução</text>

    <!-- Subcard Raio-X -->
    <rect x="16" y="80" width="218" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="98" class="item-title" fill="#166534">Diagnóstico Inteligente:</text>
    <text x="24" y="115" class="item-desc" fill="#15803d">• O que você domina</text>
    <text x="24" y="132" class="item-desc" fill="#166534">• Pontos cegos &amp; Erros</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="18" y="10" class="item-title">Nota de Didática (0-100)</text>
      <text x="18" y="26" class="item-desc">Métrica de clareza e poder</text>
      <text x="18" y="40" class="item-desc">de síntese da explicação.</text>

      <circle cx="6" cy="66" r="4" fill="#10b981"/>
      <text x="18" y="70" class="item-title">Flashcards Automáticos</text>
      <text x="18" y="86" class="item-desc">Gera cartões apenas com o que</text>
      <text x="18" y="100" class="item-desc">você esqueceu ou errou.</text>

      <circle cx="6" cy="124" r="4" fill="#10b981"/>
      <text x="18" y="128" class="item-title">Gamificação ("Evolua seu Aluno")</text>
      <text x="18" y="144" class="item-desc">XP acumulativo, níveis do aluno</text>
      <text x="18" y="158" class="item-desc">e diplomas acadêmicos.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(40, 458)">
    <rect width="880" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#4f46e5"/>
    <text x="38" y="25" class="footer-text">
      <tspan font-weight="700" fill="#0f172a">Arquitetura Integrada:</tspan> Metas organizadas no StudyFlow agora alimentam diretamente as sessões de ensino do Laboratório Invert.
    </text>
  </g>
</svg>