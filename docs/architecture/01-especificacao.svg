<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #64748b; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8faff" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="500" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#4f46e5" />
    <path d="M12 18L16 22L24 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="48" y="20" class="title">1. Arquitetura da Fase de Especificação</text>
    <text x="48" y="36" class="subtitle">Ciclo de Engenharia de Prompts no Google AI Studio: Da Concepção da Ideia aos Requisitos de Negócio</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(322, 230)">
    <path d="M0 0 L26 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="24,-5 34,0 24,5" fill="#4f46e5"/>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(638, 230)">
    <path d="M0 0 L26 0" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <polygon points="24,-5 34,0 24,5" fill="#4f46e5"/>
  </g>

  <!-- CARD 1: Ideação no Playground -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="280" height="325" rx="14" fill="url(#cardGrad1)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Card Top Badge -->
    <rect x="16" y="16" width="105" height="24" rx="6" fill="#e0e7ff"/>
    <text x="24" y="32" class="badge-text" fill="#4338ca">PROMPT 1 • IDEAÇÃO</text>
    <text x="16" y="65" class="card-title">Exploração Conceitual</text>

    <!-- Subcard Prompt -->
    <rect x="16" y="80" width="248" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="98" class="item-title" fill="#64748b">Ambiente: Google AI Studio</text>
    <text x="26" y="116" class="code-font" fill="#4f46e5">&quot;Dê uma ideia de aplicativo</text>
    <text x="26" y="132" class="code-font" fill="#4f46e5">para ajudar pessoas a estudar&quot;</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#6366f1"/>
      <text x="18" y="10" class="item-title">Brainstorming Orientado a IA</text>
      <text x="18" y="26" class="item-desc">Uso do Playground de IA generativa</text>
      <text x="18" y="40" class="item-desc">para mapear dores de aprendizado.</text>

      <circle cx="6" cy="66" r="4" fill="#6366f1"/>
      <text x="18" y="70" class="item-title">Identificação do StudyFlow</text>
      <text x="18" y="86" class="item-desc">Concepção de um gerenciador visual</text>
      <text x="18" y="100" class="item-desc">de metas simples e acessível.</text>

      <circle cx="6" cy="124" r="4" fill="#6366f1"/>
      <text x="18" y="128" class="item-title">Interpretação Semântica</text>
      <text x="18" y="144" class="item-desc">A IA transforma linguagem natural</text>
      <text x="18" y="158" class="item-desc">em propostas de solução funcional.</text>
    </g>
  </g>

  <!-- CARD 2: Engenharia de Requisitos -->
  <g transform="translate(356, 95)" filter="url(#shadow)">
    <rect width="280" height="325" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="2"/>
    <!-- Card Top Badge -->
    <rect x="16" y="16" width="125" height="24" rx="6" fill="#fef3c7"/>
    <text x="24" y="32" class="badge-text" fill="#b45309">PROMPT 2 • REQUISITOS</text>
    <text x="16" y="65" class="card-title">Estruturação de Produto</text>

    <!-- Subcard Persona -->
    <rect x="16" y="80" width="248" height="66" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="26" y="98" class="item-title" fill="#92400e">Persona Especialista em Produto:</text>
    <text x="26" y="116" class="code-font" fill="#b45309">&quot;Especialista em produtos</text>
    <text x="26" y="132" class="code-font" fill="#b45309">digitais educacionais...&quot;</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#f59e0b"/>
      <text x="18" y="10" class="item-title">Regra de Ouro da Especificação</text>
      <text x="18" y="26" class="item-desc font-semibold" fill="#b45309">"Não escreva código ainda"</text>
      <text x="18" y="40" class="item-desc">Foco no problema antes da solução.</text>

      <circle cx="6" cy="66" r="4" fill="#f59e0b"/>
      <text x="18" y="70" class="item-title">4 Pilares da Resposta Solicitada</text>
      <text x="18" y="86" class="item-desc">1. Problema | 2. Público-alvo</text>
      <text x="18" y="100" class="item-desc">3. Requisitos | 4. Critérios de Teste</text>

      <circle cx="6" cy="124" r="4" fill="#f59e0b"/>
      <text x="18" y="128" class="item-title">Modelagem de Atributos</text>
      <text x="18" y="144" class="item-desc">Título, descrição, prazo e status</text>
      <text x="18" y="158" class="item-desc">definidos como entidade central.</text>
    </g>
  </g>

  <!-- CARD 3: Artefatos e Critérios Gerados -->
  <g transform="translate(672, 95)" filter="url(#shadow)">
    <rect width="250" height="325" rx="14" fill="url(#cardGrad1)" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Card Top Badge -->
    <rect x="16" y="16" width="125" height="24" rx="6" fill="#dcfce7"/>
    <text x="24" y="32" class="badge-text" fill="#15803d">OUTPUT • ESPECIFICAÇÃO</text>
    <text x="16" y="65" class="card-title">Matriz de Definição</text>

    <!-- Subcard Output Resumo -->
    <rect x="16" y="80" width="218" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="98" class="item-title" fill="#166534">Público-Alvo Principal:</text>
    <text x="24" y="115" class="item-desc" fill="#15803d">Estudantes iniciantes</text>
    <text x="24" y="132" class="item-desc" fill="#166534">com necessidade de organização.</text>

    <!-- Bullets -->
    <g transform="translate(16, 165)">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="18" y="10" class="item-title">Escopo Funcional (CRUD)</text>
      <text x="18" y="26" class="item-desc">Cadastrar, listar, editar e excluir</text>
      <text x="18" y="40" class="item-desc">objetivos de aprendizado.</text>

      <circle cx="6" cy="66" r="4" fill="#10b981"/>
      <text x="18" y="70" class="item-title">Critério de Persistência</text>
      <text x="18" y="86" class="item-desc">Manter dados no navegador</text>
      <text x="18" y="100" class="item-desc">mesmo após recarregar a página.</text>

      <circle cx="6" cy="124" r="4" fill="#10b981"/>
      <text x="18" y="128" class="item-title">Critérios de Aceitação</text>
      <text x="18" y="144" class="item-desc">Base formal para a validação</text>
      <text x="18" y="158" class="item-desc">da versão 1.0 (MVP).</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(40, 438)">
    <rect width="880" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#4f46e5"/>
    <text x="38" y="25" class="footer-text">
      <tspan font-weight="700" fill="#0f172a">Princípio de Engenharia:</tspan> Definir com clareza o problema e os critérios de validação antes de qualquer linha de código gerada.
    </text>
  </g>
</svg>