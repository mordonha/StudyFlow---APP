<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .comp-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .comp-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
      .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 34)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#0284c7" />
    <path d="M11 14H25M11 18H25M11 22H19" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="48" y="20" class="title">2. Arquitetura da Fase de Planejamento (Módulos &amp; Contratos)</text>
    <text x="48" y="36" class="subtitle">Decomposição das Novas Camadas: Laboratório Invert, Serviços de IA/Áudio e Persistência</text>
  </g>

  <!-- Grid Layout: 4 Architectural Pillars -->

  <!-- PILAR 1: UX/UI & Modos de Uso -->
  <g transform="translate(40, 90)" filter="url(#shadow2)">
    <rect width="210" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="14" y="14" width="105" height="22" rx="6" fill="#e0f2fe"/>
    <text x="22" y="29" class="badge-text" fill="#0369a1">PILAR 1 • UX/UI</text>
    <text x="14" y="58" class="card-title">Diretrizes de Uso</text>

    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="182" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="comp-title">Navegação Unificada</text>
      <text x="10" y="34" class="comp-desc">Aba 1: Metas &amp; Prazos (CRUD)</text>
      <text x="10" y="46" class="comp-desc">Aba 2: Evolução do Aluno IA</text>

      <rect x="0" y="62" width="182" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="comp-title">Modo Caminhada 🎧</text>
      <text x="10" y="34" class="comp-desc">Áudio Hands-Free com</text>
      <text x="10" y="48" class="comp-desc">Text-to-Speech nativo pt-BR.</text>

      <rect x="0" y="128" width="182" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="18" class="comp-title">Entrada por Voz e Texto</text>
      <text x="10" y="34" class="comp-desc">Web Speech Recognition para</text>
      <text x="10" y="48" class="comp-desc">ditar explicações em tempo real.</text>

      <rect x="0" y="200" width="182" height="88" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="10" y="18" class="comp-title" fill="#166534">Atalho no GoalCard 💡</text>
      <text x="10" y="34" class="comp-desc" fill="#15803d">Botão "Ensinar este Tema"</text>
      <text x="10" y="48" class="comp-desc" fill="#15803d">preenche o Invert diretamente</text>
      <text x="10" y="62" class="comp-desc" fill="#15803d">com o objetivo selecionado.</text>
    </g>
  </g>

  <!-- PILAR 2: Decomposição de Componentes -->
  <g transform="translate(262, 90)" filter="url(#shadow2)">
    <rect width="216" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="14" y="14" width="128" height="22" rx="6" fill="#ede9fe"/>
    <text x="22" y="29" class="badge-text" fill="#6d28d9">PILAR 2 • FRONTEND</text>
    <text x="14" y="58" class="card-title">Componentes React</text>

    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;TeachingSessionModal /&gt;</text>
      <text x="10" y="30" class="comp-desc">Sala interativa de ensino &amp; chat</text>

      <rect x="0" y="44" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;PersonaSelector /&gt;</text>
      <text x="10" y="30" class="comp-desc">Seleção de Arthur, Beatriz ou Carlos</text>

      <rect x="0" y="88" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;KnowledgeReportModal /&gt;</text>
      <text x="10" y="30" class="comp-desc">Raio-X, nota, lacunas &amp; flashcards</text>

      <rect x="0" y="132" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;StudentEvolutionView /&gt;</text>
      <text x="10" y="30" class="comp-desc">Gamificação, XP, níveis &amp; diplomas</text>

      <rect x="0" y="176" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;GoalCard /&gt; + Invert CTA</text>
      <text x="10" y="30" class="comp-desc">Gatilho de ensino por objetivo</text>

      <rect x="0" y="220" width="188" height="38" rx="7" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#6d28d9">&lt;Header /&gt; com Abas</text>
      <text x="10" y="30" class="comp-desc">Transição fluida entre modos</text>
    </g>
  </g>

  <!-- PILAR 3: Tipagem Estrita TypeScript -->
  <g transform="translate(490, 90)" filter="url(#shadow2)">
    <rect width="216" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="14" y="14" width="128" height="22" rx="6" fill="#e0e7ff"/>
    <text x="22" y="29" class="badge-text" fill="#4338ca">PILAR 3 • MODELOS</text>
    <text x="14" y="58" class="card-title">Types do Invert</text>

    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="188" height="98" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#1e293b">interface KnowledgeReport {</text>
      <text x="16" y="32" class="code-font" fill="#6366f1">clarityScore: number;</text>
      <text x="16" y="48" class="code-font" fill="#6366f1">masteredConcepts: string[];</text>
      <text x="16" y="64" class="code-font" fill="#6366f1">blindSpots: string[];</text>
      <text x="16" y="80" class="code-font" fill="#6366f1">generatedFlashcards: ...</text>
      <text x="10" y="94" class="code-font" fill="#1e293b">}</text>

      <rect x="0" y="106" width="188" height="88" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#0f172a">VirtualStudentProgress {</text>
      <text x="14" y="32" class="code-font" fill="#b45309">level: number;</text>
      <text x="14" y="48" class="code-font" fill="#b45309">currentXP: number;</text>
      <text x="14" y="64" class="code-font" fill="#b45309">diplomasUnlocked: string[];</text>
      <text x="10" y="80" class="code-font" fill="#0f172a">}</text>

      <rect x="0" y="202" width="188" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#1e293b">StudentPersonaId =</text>
      <text x="14" y="32" class="code-font" fill="#15803d">'sobrinho' |</text>
      <text x="14" y="48" class="code-font" fill="#15803d">'cetico' |</text>
      <text x="14" y="64" class="code-font" fill="#15803d">'vestibulando'</text>
    </g>
  </g>

  <!-- PILAR 4: Serviços & Armazenamento -->
  <g transform="translate(718, 90)" filter="url(#shadow2)">
    <rect width="202" height="375" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="14" y="14" width="128" height="22" rx="6" fill="#fef3c7"/>
    <text x="22" y="29" class="badge-text" fill="#b45309">PILAR 4 • SERVIÇOS</text>
    <text x="14" y="58" class="card-title">InvertService</text>

    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="174" height="66" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="10" y="18" class="comp-title" fill="#92400e">Motor de IA Feynman</text>
      <text x="10" y="34" class="comp-desc" fill="#78350f">Reações contextuais do aluno</text>
      <text x="10" y="48" class="comp-desc" fill="#78350f">e diagnóstico de didática.</text>

      <rect x="0" y="74" width="174" height="88" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="10" y="16" class="code-font" fill="#0369a1">• generateReaction()</text>
      <text x="10" y="32" class="code-font" fill="#0369a1">• generateReport()</text>
      <text x="10" y="48" class="code-font" fill="#0369a1">• addXP() / Diplomas</text>
      <text x="10" y="64" class="code-font" fill="#0369a1">• speakText() (Voz)</text>
      <text x="10" y="80" class="code-font" fill="#0369a1">• saveReport()</text>

      <rect x="0" y="170" width="174" height="96" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="18" class="comp-title">Persistência Dual</text>
      <text x="10" y="34" class="comp-desc">• studyflow_objectives_v1</text>
      <text x="10" y="48" class="comp-desc">• studyflow_invert_progress_v2</text>
      <text x="10" y="62" class="comp-desc">• studyflow_invert_reports_v1</text>
      <text x="10" y="78" class="comp-desc">Tudo 100% no localStorage.</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(40, 480)">
    <rect width="880" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="24" cy="21" r="5" fill="#0284c7"/>
    <text x="38" y="25" class="footer-text">
      <tspan font-weight="700" fill="#0f172a">Arquitetura Modular:</tspan> O Invert estende o StudyFlow como um subsistema especializado, mantendo a independência das camadas.
    </text>
  </g>
</svg>